<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%">
  <defs>
    <style>
      .brand-title { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #ffffff; }
      }
    </style>
    <linearGradient id="fortesiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (F - Shield & Tech Node) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon Frame -->
    <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#shieldGrad)" stroke="url(#fortesiaGrad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Glowing F Monogram -->
    <path d="M34 26 H72 M34 26 V74 M34 48 H62" stroke="url(#fortesiaGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
    
    <!-- Tech Nodes / Circuit Accents -->
    <circle cx="72" cy="26" r="3.5" fill="#38BDF8" />
    <circle cx="62" cy="48" r="3.5" fill="#818CF8" />
    <circle cx="34" cy="74" r="3.5" fill="#A855F7" />
    <circle cx="50" cy="96" r="2.5" fill="#C084FC" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 42)">
    <!-- Brand Primary Name -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" class="brand-title">
      FORTESIA
    </text>
    
    <!-- Brand Slogan / Sub-brand -->
    <text x="2" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="url(#fortesiaGrad)">
      TECH INNOVATION
    </text>
  </g>
</svg>
